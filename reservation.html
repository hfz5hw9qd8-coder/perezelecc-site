<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prendre rendez-vous — PEREZELECC</title><link rel="stylesheet" href="reservation.css"></head><body><main><a class="back" href="index.html">← Retour au site</a><div class="wrap"><div class="intro"><span>RENDEZ-VOUS PEREZELECC</span><h1>Choisissez votre créneau.</h1><p>Sélectionnez le type d'intervention, une date et un créneau disponible. Votre demande est enregistrée dans le calendrier PEREZELECC.</p></div><form id="booking"><label>Type d'intervention<select id="service" required><option value="">Choisir…</option><option>Dépannage</option><option>Installation électrique</option><option>Rénovation électrique</option><option>Mise en conformité</option><option>Borne de recharge</option><option>Autre</option></select></label><label>Date<input id="date" type="date" required></label><div><label>Créneau</label><div id="slots" class="slots">Choisissez une date.</div></div><input id="time" type="hidden" required><label>Nom / entreprise<input id="name" required></label><label>Téléphone<input id="phone" type="tel" required></label><label>Email<input id="email" type="email"></label><label>Précisions<textarea id="notes" placeholder="Adresse, nature du problème, informations utiles…"></textarea></label><button>CONFIRMER LA DEMANDE</button><p id="msg" aria-live="polite"></p></form></div></main><script src="reservation.js"></script></body></html>
